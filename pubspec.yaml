name: fresh_leaf
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  geolocator: ^14.0.2
  get: ^4.7.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  smooth_page_indicator: ^2.0.1
  google_generative_ai: ^0.4.7
  get_storage: ^2.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/ai_context/
    - assets/logo/
  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Bold.ttf
          weight: 700
