name: fresh_leaf
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.9.2
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  geolocator: ^14.0.2
  get: ^4.7.3
  get_storage: ^2.1.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  pusher_channels_flutter: ^2.6.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/ai_context/
    - assets/logo/
  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_khmer/NotoSansKhmer-Bold.ttf
          weight: 700
