name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Bootstraps Dart for installing FVM; project Flutter comes from .fvmrc.
      - name: Set up bootstrap Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate FVM
        run: dart pub global activate fvm

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install pinned Flutter with FVM
        run: fvm install

      - name: Show tool versions
        run: |
          java -version
          fvm flutter --version
          cd android
          ./gradlew --version

      - name: Flutter pub get
        run: fvm flutter pub get

      - name: Flutter analyze
        run: fvm flutter analyze

      - name: Gradle task graph check
        run: |
          cd android
          ./gradlew tasks --no-daemon
